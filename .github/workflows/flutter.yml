name: Flutter CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Native unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test experiment controller
        env:
          PYTHONPATH: tools/experiment_controller
        run: python -m unittest discover -s tools/experiment_controller/tests -v

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Test firmware codec
        working-directory: firmware/esp32c3
        run: python -m platformio test -e native

      - name: Build ESP32-C3 firmware
        working-directory: firmware/esp32c3
        run: python -m platformio run -e esp32c3

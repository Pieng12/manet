[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
extra_scripts = pre:build_id.py
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

lib_deps =
  h2zero/NimBLE-Arduino@2.5.1
  bblanchon/ArduinoJson@7.3.1

build_flags =
  -D CONFIG_BT_NIMBLE_EXT_ADV=1
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter = +<Protocol.cpp> +<NeighborTransport.cpp> -<main.cpp> -<CodedRadio.cpp>
